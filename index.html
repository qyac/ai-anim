<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 内联一个空图标：否则浏览器会去请求 /favicon.ico，控制台里多一条 404 噪音 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a0b'/%3E%3Crect x='3' y='7' width='10' height='2' fill='%23ff4d12'/%3E%3C/svg%3E" />
  <title>anim · 代码动画引擎</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0a0a0b; color: #eee9df;
      font: 13px/1.5 ui-monospace, "SFMono-Regular", "IBM Plex Mono", Consolas, monospace; overflow: hidden; }
    #wrap { position: fixed; inset: 0 0 92px 0; display: grid; place-items: center; }
    /* 画布按可视区等比缩放（工作台占了底部 92px，不缩会被裁） */
    #c { display: block; background: #000; box-shadow: 0 0 0 1px #2a2a2c;
      max-width: 100%; max-height: 100%; width: auto; height: auto; }
    #hud { position: fixed; left: 12px; top: 10px; padding: 8px 10px; background: #101012cc;
      border: 1px solid #2a2a2c; border-radius: 6px; white-space: pre; pointer-events: none;
      opacity: .9; backdrop-filter: blur(4px); max-width: min(60ch, 70vw); }
    #hud b { color: #ff4d12; font-weight: 600; }
    #hud .err { color: #ff6a6a; }
    #hud .ok { color: #d8ff3c; }
    #msg { position: fixed; left: 12px; bottom: 84px; padding: 6px 9px; background: #101012cc;
      border: 1px solid #2a2a2c; border-radius: 6px; opacity: .85; pointer-events: none; z-index: 3; }
    /* 预览工作台：进度条 + 场景刻线 + 走带 */
    #wb { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 8px 12px 10px;
      background: linear-gradient(#0a0a0b00, #0a0a0bee 28%); border-top: 1px solid #24242a; }
    #wbBar { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    #wbBar button { background: #16161a; color: #d8d4c8; border: 1px solid #2e2e34; border-radius: 5px;
      padding: 4px 9px; font: inherit; cursor: pointer; }
    #wbBar button:hover { border-color: #ff4d12; color: #fff; }
    #wbBar button.on { border-color: #ff4d12; color: #ff4d12; }
    #wbReadout { margin-left: auto; opacity: .8; white-space: pre; }
    #wbScrubWrap { position: relative; height: 26px; }
    #wbTicks { position: absolute; inset: 0 0 auto 0; height: 12px; pointer-events: none; }
    #wbTicks i { position: absolute; top: 0; width: 1px; height: 12px; background: #4b4b55; }
    #wbTicks i.beat { height: 6px; background: #33333b; }
    #wbTicks i.cur { background: #ff4d12; width: 2px; }
    #wbTicks b { position: absolute; top: 12px; font-size: 10px; font-weight: 500; color: #8b8b96;
      transform: translateX(2px); white-space: nowrap; }
    #wbScrub { position: absolute; left: 0; right: 0; top: 8px; width: 100%; height: 16px;
      -webkit-appearance: none; appearance: none; background: transparent; }
    #wbScrub::-webkit-slider-runnable-track { height: 4px; background: #26262d; border-radius: 2px; }
    #wbScrub::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px;
      border-radius: 50%; background: #ff4d12; border: 1px solid #0a0a0b; cursor: pointer; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div id="hud">loading…</div>
  <div id="msg"></div>
  <div id="wb" hidden>
    <div id="wbBar">
      <button id="wbPlay" title="空格">▶ 播放</button>
      <button id="wbPrev" title="[">⟨ 段</button>
      <button id="wbNext" title="]">段 ⟩</button>
      <button id="wbF1" title=",">−1f</button>
      <button id="wbP1" title=".">+1f</button>
      <button id="wbLoop" title="循环当前段">⟲ 循环</button>
      <button id="wbPrecise" title="按导出路径重渲当前帧（多子帧）">⦿ 精确帧</button>
      <span id="wbReadout">—</span>
    </div>
    <div id="wbScrubWrap">
      <div id="wbTicks"></div>
      <input id="wbScrub" type="range" min="0" max="1" step="0.001" value="0" />
    </div>
  </div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
